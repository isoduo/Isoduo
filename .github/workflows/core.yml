name: Core
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref_type == 'tag' && format('tag-run-{0}', github.run_id)) || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'
      - name: Build and test Release core
        run: cmake --workflow --preset windows-clang-cl-release-core
      - name: Build and test Debug core with a combined Debug and Release package
        env:
          ISODUO_PACKAGE_RELEASE_BUILD: ${{ github.workspace }}/build/Release-core
        run: cmake --workflow --preset windows-clang-cl-debug-core
      - name: Upload CTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-ctest-logs
          path: |
            build/Release-core/Testing/Temporary/
            build/Debug-core/Testing/Temporary/
          if-no-files-found: warn
  windows-cl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked line endings
        run: cmake -P cmake/ci/CheckLineEndings.cmake
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'
      - name: Build and test the core with cl.exe
        run: cmake --workflow --preset windows-cl-release-core
