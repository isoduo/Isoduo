name: Linux
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref_type == 'tag' && format('tag-run-{0}', github.run_id)) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [clang, gcc]
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop, naming check and render test packages
        run: cmake -DDESKTOP=ON -DRENDER_TESTS=ON -P cmake/ci/InstallLinuxPackages.cmake
      - name: Build and test core
        run: cmake --workflow --preset linux-${{ matrix.compiler }}-release-core
      - name: Build desktop
        run: cmake --workflow --preset linux-${{ matrix.compiler }}-release
      - name: Check identifier names
        run: ctest --test-dir build/linux-${{ matrix.compiler }}-release --no-tests=error --output-on-failure -R '^identifier_naming'
      - name: Run the native renderer fault sweep
        run: cmake "-DBUILD_DIR=build/linux-${{ matrix.compiler }}-release" -P cmake/ci/TestLinuxRendererFaultSweep.cmake
