name: Linux
on: [push, pull_request]

jobs:
  build:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [clang, gcc]
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop development packages
        run: cmake -DISODUO_INSTALL_RENDER_TEST_PACKAGES=ON -P cmake/ci/InstallLinuxDesktopPackages.cmake
      - name: Build and test core
        run: cmake --workflow --preset linux-${{ matrix.compiler }}-release-core
      - name: Build desktop
        run: cmake --workflow --preset linux-${{ matrix.compiler }}-release
      - name: Run the native renderer fault sweep
        run: cmake "-DBUILD_DIR=build/linux-${{ matrix.compiler }}-release" -P cmake/ci/TestLinuxRendererFaultSweep.cmake
