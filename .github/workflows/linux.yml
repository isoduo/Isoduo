name: Linux
on: [push, pull_request]

jobs:
  build:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [clang, gcc]
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop and naming check packages
        run: cmake -DDESKTOP=ON -P cmake/ci/InstallLinuxPackages.cmake
      - name: Build and test core
        run: cmake --workflow --preset linux-${{ matrix.compiler }}-release-core
      - name: Build desktop
        run: cmake --workflow --preset linux-${{ matrix.compiler }}-release
      - name: Check identifier names
        run: ctest --test-dir build/linux-${{ matrix.compiler }}-release --no-tests=error --output-on-failure -R '^identifier_naming'
