# Trial only: do not require this check until 20 consecutive first-attempt passes.
name: UIA trial
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  uia:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.5/mesa3d-26.2.5-release-msvc.7z
      MESA_SHA256: 997123ef4ce8896204ab912d5b54f19372c487ff9835bcefafa2fca23b8953c2
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'
      - name: Configure Release
        run: cmake --preset windows-clang-cl-release
      - name: Build Release
        run: cmake --build --preset windows-clang-cl-release
      - name: Download, verify and install application-local Mesa DLLs
        run: cmake -DDESTINATION=build/Release -P cmake/InstallMesa.cmake
      - name: Run UI Automation tests
        run: ctest --preset windows-clang-cl-release --timeout 900 -R '^uia_'
      - name: Upload CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uia-trial-diagnostics
          path: build/Release/Testing/Temporary/
          if-no-files-found: warn
