name: Release
on:
  # Drafts a release of main. README "Releasing" lists the steps around it.
  workflow_dispatch:
  # Exercise the source archive when the build entry points or archive rules change.
  push:
    paths:
      - .github/workflows/release.yml
      - .gitattributes
      - CMakePresets.json
      - cmake/SourceRevision.cmake
      - cmake/LinuxPresets.json
      - cmake/ci/*.cmake
      - tests/release_decision.cmake
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .gitattributes
      - CMakePresets.json
      - cmake/SourceRevision.cmake
      - cmake/LinuxPresets.json
      - cmake/ci/*.cmake
      - tests/release_decision.cmake

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  decide:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # Write access only so that GitHub lists existing drafts; this job changes nothing.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decide the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: cmake -P cmake/ci/DecideRelease.cmake

  windows:
    needs: decide
    if: ${{ !cancelled() && (needs.decide.result == 'success' || needs.decide.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and unpack the source archive
        run: cmake -P cmake/ci/DownloadSourceArchive.cmake
      - name: Build and test Release core
        working-directory: ${{ runner.temp }}/Isoduo
        run: cmake --workflow --preset windows-clang-cl-release-core
      - name: Configure full Release
        working-directory: ${{ runner.temp }}/Isoduo
        run: cmake --preset windows-clang-cl-release
      - name: Build full Release configuration
        working-directory: ${{ runner.temp }}/Isoduo
        run: cmake --build --preset windows-clang-cl-release
      - name: Upload CTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-windows-ctest-logs
          path: ${{ runner.temp }}/Isoduo/build/Release-core/Testing/Temporary/
          if-no-files-found: warn

  ubuntu:
    needs: decide
    if: ${{ !cancelled() && (needs.decide.result == 'success' || needs.decide.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and unpack the source archive
        run: cmake -P cmake/ci/DownloadSourceArchive.cmake
      - name: Build and test Linux core
        working-directory: ${{ runner.temp }}/Isoduo
        run: cmake --workflow --preset linux-clang-release-core
      - name: Upload CTest results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-linux-ctest
          path: ${{ runner.temp }}/Isoduo/build/linux-clang-release-core/Testing/Temporary/
          if-no-files-found: warn

  draft:
    needs: [decide, windows, ubuntu]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Decide again: someone may have drafted this version while the archives were building.
      - name: Check the release again
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: cmake "-DNOTES_PATH=${{ runner.temp }}/release-notes.md" -P cmake/ci/DecideRelease.cmake
      # The tag does not exist yet: GitHub creates it on the full SHA when the author publishes the draft.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
          TITLE: ${{ steps.decide.outputs.title }}
        run: cmake "-DNOTES_PATH=${{ runner.temp }}/release-notes.md" -P cmake/ci/DraftRelease.cmake
